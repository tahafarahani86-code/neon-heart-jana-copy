<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday JANA ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050005;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      z-index: 2;
      top: 8%;
      width: 100%;
      text-align: center;
      color: #ff315b;
      letter-spacing: 4px;
      text-shadow: 0 0 15px red;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="heartCanvas"></canvas>
  <div class="caption">MADE WITH LOVE ♥</div>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    let startTime = performance.now();

    const ECG_DURATION = 5000;
    const HEART_START = ECG_DURATION;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heart(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t))
      };
    }

    function drawHeart(size, progress, glow) {
      const points = 240;
      const count = Math.floor(points * progress);

      if (count < 2) return;

      ctx.beginPath();

      for (let i = 0; i <= count; i++) {
        const p = heart(i / points * Math.PI * 2);
        const x = width / 2 + p.x * size;
        const y = height / 2 + p.y * size;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "#ff003c";

      ctx.strokeStyle = "#ff003c";
      ctx.lineWidth = Math.max(1, size * 0.16);
      ctx.shadowBlur = glow * 3;
      ctx.stroke();

      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = Math.max(1, size * 0.09);
      ctx.shadowBlur = glow * 1.8;
      ctx.stroke();

      ctx.strokeStyle = "#fff0f4";
      ctx.lineWidth = Math.max(1, size * 0.035);
      ctx.shadowBlur = glow;
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    function drawName(beat) {
      const letters = ["J", "A", "N", "A"];
      const fontSize = Math.max(
        8, Math.min(width, height) * 0.018
      );

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.fillStyle = "#fff0f4";
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 12;

      const x = width / 2;
      const startY =
        height / 2 - Math.min(width, height) * 0.13 * beat;
      const spacing = fontSize * 0.9;

      letters.forEach((letter, i) => {
        ctx.fillText(letter, x, startY + i * spacing);
      });

      ctx.restore();
    }

    // Phase 1: ECG pulse transforms into hand-drawn neon lettering
    function drawECG(elapsed) {
      ctx.clearRect(0, 0, width, height);

      const centerY = height * 0.50;
      const progress = Math.max(0, Math.min(1, elapsed / ECG_DURATION));
      const introDuration = 850;

      ctx.save();
      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 16;

      // First, draw a moving ECG pulse.
      if (elapsed < introDuration) {
        const scanX = width * (elapsed / introDuration);
        const period = Math.max(180, Math.min(width * 0.38, 250));
        const amp = Math.min(height * 0.09, 38);

        function ecgY(x) {
          const t = (x % period) / period;

          // Classic ECG: P wave, sharp QRS spike, then T wave.
          if (t < 0.16) return centerY;
          if (t < 0.22) return centerY - amp * 0.18
            * Math.sin(((t - 0.16) / 0.06) * Math.PI);
          if (t < 0.36) return centerY;
          if (t < 0.40) return centerY + amp * 0.22
            * ((t - 0.36) / 0.04);
          if (t < 0.45) return centerY + amp * 0.22
            - amp * 1.45 * ((t - 0.40) / 0.05);
          if (t < 0.50) return centerY - amp * 1.23
            + amp * 1.48 * ((t - 0.45) / 0.05);
          if (t < 0.70) return centerY;
          if (t < 0.84) return centerY - amp * 0.24
            * Math.sin(((t - 0.70) / 0.14) * Math.PI);
          return centerY;
        }

        ctx.beginPath();
        ctx.moveTo(0, centerY);
        for (let x = 2; x <= scanX; x += 2) {
          ctx.lineTo(x, ecgY(x));
        }
        // Layered red neon with a fine white core.
        ctx.strokeStyle = "#ff003c";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 22;
        ctx.stroke();

        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 1.8;
        ctx.shadowBlur = 12;
        ctx.stroke();

        ctx.strokeStyle = "#fff0f4";
        ctx.lineWidth = 0.8;
        ctx.shadowBlur = 5;
        ctx.stroke();

        ctx.restore();
        return;
      }

      // Each character is built from neon vector strokes, not a font.
      const glyphs = {
        H: [[0,0,0,6],[4,0,4,6],[0,3,4,3]],
        A: [[0,6,0.5,1,2,0,3.5,1,4,6],[0.7,4,3.3,4]],
        P: [[0,6,0,0,3,0,4,1,4,2,3,3,0,3]],
        Y: [[0,0,2,3,4,0],[2,3,2,6]],
        B: [[0,6,0,0,2.8,0,4,1,4,2,3,3,0,3],[3,3,4,4,4,5,3,6,0,6]],
        I: [[0,0,4,0],[2,0,2,6],[0,6,4,6]],
        R: [[0,6,0,0,3,0,4,1,4,2,3,3,0,3],[2,3,4,6]],
        T: [[0,0,4,0],[2,0,2,6]],
        D: [[0,6,0,0,2.5,0,4,1,4,5,2.5,6,0,6]],
        J: [[0,0,4,0],[3.5,0,3.5,5,2.5,6,1,6,0,5]],
        N: [[0,6,0,0,4,6,4,0]]
      };

      const message = "HAPPY BIRTHDAY JANA";
      const advance = 4.8;
      const spaceWidth = 2.5;
      const units = [...message].reduce(
        (sum, ch) => sum + (ch === " " ? spaceWidth : advance), 0
      );
      const scale = Math.min(
        (width - 28) / units,
        Math.min(width, height) * 0.045,
        6
      );
      const totalWidth = units * scale;
      const left = (width - totalWidth) / 2;
      const top = centerY - 3 * scale;
      const reveal = Math.max(
        0, Math.min(1, (elapsed - introDuration) / (ECG_DURATION - introDuration - 1000))
      );
      const revealX = left + totalWidth * reveal;

      ctx.save();
      ctx.beginPath();
      ctx.rect(left - 2, top - 3, totalWidth * reveal, 6 * scale + 6);
      ctx.clip();

      let x = left;

      for (const ch of message) {
        if (ch === " ") {
          x += spaceWidth * scale;
          continue;
        }

        const strokes = glyphs[ch];
        if (strokes) {
          for (const points of strokes) {
            ctx.beginPath();
            for (let i = 0; i < points.length; i += 2) {
              const gx = points[i];
              const gy = points[i + 1];
              // A subtle italic slant for a more elegant lettering style.
              const px = x + (gx + (6 - gy) * 0.18) * scale;
              const py = top + gy * scale;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }

            // Three neon layers: red glow, vivid red, and a white-hot core.
            ctx.strokeStyle = "#ff003c";
            ctx.lineWidth = Math.max(2, scale * 0.34);
            ctx.shadowColor = "#ff003c";
            ctx.shadowBlur = 20;
            ctx.stroke();

            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = Math.max(1.5, scale * 0.18);
            ctx.shadowBlur = 10;
            ctx.stroke();

            ctx.strokeStyle = "#fff0f4";
            ctx.lineWidth = Math.max(1, scale * 0.07);
            ctx.shadowBlur = 5;
            ctx.stroke();
          }
        }

        x += advance * scale;
      }

      ctx.restore();

      // A glowing cursor marks the point where the neon line is being drawn.
      if (reveal > 0 && reveal < 1) {
        ctx.beginPath();
        ctx.arc(revealX, centerY, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "#fff0f4";
        ctx.shadowBlur = 20;
        ctx.fill();
      }

      ctx.restore();
    }


    // Phase 3: the original layered neon heart animation
    function drawHearts(now, elapsed) {
      ctx.clearRect(0, 0, width, height);

      const pulse = now % 1800;

      const beat = pulse < 180
        ? 1 + Math.sin((pulse / 180) * Math.PI) * 0.12
        : pulse < 360
          ? 1 + Math.sin(((pulse - 180) / 180) * Math.PI) * 0.07
          : 1 + Math.sin(now * 0.002) * 0.012;

      for (let i = 0; i < 16; i++) {
        const progress = Math.min(
          1, Math.max(0, (elapsed - i * 150) / 2200)
        );

        const size = (0.22 + i * 0.075)
          * Math.min(width, height) / 48 * beat;

        drawHeart(size, progress, 30 + i * 2.5);
      }

      const nameProgress = Math.min(
        1, Math.max(0, (elapsed - 2200) / 1000)
      );

      if (nameProgress > 0) {
        ctx.globalAlpha = nameProgress;
        drawName(beat);
        ctx.globalAlpha = 1;
      }
    }

    function animate(now) {
      const elapsed = now - startTime;

      if (elapsed < ECG_DURATION) {
        drawECG(elapsed);
      } else {
        drawHearts(now, elapsed - HEART_START);
      }

      requestAnimationFrame(animate);
    }

    // Tap or click anywhere to replay the whole sequence
    document.addEventListener("pointerdown", () => {
      startTime = performance.now();
    });

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
